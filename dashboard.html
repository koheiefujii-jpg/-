    justify-content: center;

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatDateJP(dateStr) {
  const d = new Date(dateStr);
  const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${dayNames[d.getDay()]}）`;
}

function getDataByDate(dateStr) {
  return ANALYSIS_DATA.find(d => d.date === dateStr);
}

function getDataInRange(startDate, endDate) {
  return ANALYSIS_DATA.filter(d => {
    const date = new Date(d.date);
    return date >= startDate && date <= endDate;
  });
}

/* ============================================================
   📌 カレンダー描画
   ============================================================ */
function renderCalendar() {
  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();
  document.getElementById("monthLabel").textContent = `${year}年 ${month + 1}月`;

  const grid = document.getElementById("calendarGrid");
  // 既存の日付セルを削除（曜日ヘッダー7個は残す）
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  // 月初までの空白
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement("div");
    cell.className = "day-cell empty";
    grid.appendChild(cell);
  }

  // 各日付セル
  for (let d = 1; d <= lastDate; d++) {
    const date = new Date(year, month, d);
    const dateStr = formatDate(date);
    const hasData = !!getDataByDate(dateStr);

    const cell = document.createElement("div");
    cell.className = "day-cell " + (hasData ? "has-data" : "no-data");
    cell.textContent = d;
    cell.dataset.date = dateStr;

    if (selectedDate === dateStr) cell.classList.add("selected");

    cell.addEventListener("click", () => {
      selectedDate = dateStr;
      renderCalendar();
      renderDetail();
    });

    grid.appendChild(cell);
  }
}

/* ============================================================
   📌 詳細パネル描画
   ============================================================ */
function renderDetail() {
  const card = document.getElementById("detailCard");

  // 未選択
  if (!selectedDate) {
    card.innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <h3>日付を選択してください</h3>
        <p>カレンダーの色付きの日付をクリックすると、<br>その日の分析結果が表示されます。</p>
      </div>`;
    return;
  }

  // 期間に応じた表示分岐
  switch (currentPeriod) {
    case "day":   renderDayDetail(card); break;
    case "week":  renderRangeDetail(card, getWeekRange(selectedDate), "週"); break;
    case "month": renderRangeDetail(card, getMonthRange(selectedDate), "月"); break;
    case "half":  renderRangeDetail(card, getHalfRange(selectedDate), "半年"); break;
    case "year":  renderRangeDetail(card, getYearRange(selectedDate), "年間"); break;
  }
}

/* ===== 単日表示 ===== */
function renderDayDetail(card) {
  const data = getDataByDate(selectedDate);

  if (!data) {
    card.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>${formatDateJP(selectedDate)}</h3>
        <p>この日の分析データはまだありません。</p>
      </div>`;
    return;
  }

  card.innerHTML = `
    <div class="detail-header">
      <div>
        <div class="detail-date">${formatDateJP(data.date)}</div>
      </div>
      <div class="detail-meta">
        <span class="badge badge-subject">📚 ${data.subject}</span>
        <span class="badge badge-class">👥 ${data.class}</span>
        <span class="badge badge-positive">⭐ 肯定発言 ${data.positive_count}回</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">よかったところ</div>
      <div class="section-content">${data.good}</div>
    </div>

    <div class="section">
      <div class="section-title">改善点</div>
      <div class="section-content">${data.improve}</div>
    </div>

    <div class="section">
      <div class="section-title">成長の記録</div>
      <div class="section-content">${data.growth}</div>
    </div>

    <div class="section">
      <div class="section-title">自立した学習者との関連</div>
      <div class="section-content">${data.independence}</div>
    </div>

    <div class="section">
      <div class="section-title">次回への課題</div>
      <div class="section-content">${data.next}</div>
    </div>
  `;
}

/* ===== 期間まとめ表示 ===== */
function renderRangeDetail(card, range, label) {
  const items = getDataInRange(range.start, range.end);
  const totalPositive = items.reduce((sum, d) => sum + (d.positive_count || 0), 0);
  const subjects = [...new Set(items.flatMap(d => d.subject.split(/[・、]/)))].filter(Boolean);

  let header = `
    <div class="detail-header">
      <div>
        <div class="detail-date">${label}まとめ</div>
        <p style="color:#7f8c8d; font-size:0.9em; margin-top:4px;">
          ${formatDateJP(formatDate(range.start))} 〜 ${formatDateJP(formatDate(range.end))}
        </p>
      </div>
    </div>`;

  if (items.length === 0) {
    card.innerHTML = header + `
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>この${label}には分析データがありません</h3>
      </div>`;
    return;
  }

  // 統計サマリ
  const summary = `
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">分析日数</div>
        <div class="stat-value">${items.length}日</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">肯定発言合計</div>
        <div class="stat-value">${totalPositive}回</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">扱った教科数</div>
        <div class="stat-value">${subjects.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">1日平均FB</div>
        <div class="stat-value">${Math.round(totalPositive / items.length)}回</div>
      </div>
    </div>`;

  // 半年・年間は傾向分析を加える
  let trendBlock = "";
  if (currentPeriod === "half" || currentPeriod === "year") {
    trendBlock = renderTrendAnalysis(items);
  }

  // エントリリスト
  const entries = items.map(d => `
    <div class="entry-item">
      <div class="entry-date">${formatDateJP(d.date)} ｜ ${d.subject}</div>
      <div class="entry-summary">${d.good.length > 100 ? d.good.substring(0, 100) + "..." : d.good}</div>
    </div>
  `).join("");

  card.innerHTML = header + summary + trendBlock + `
    <div class="section">
      <div class="section-title">分析エントリ一覧</div>
      <div class="entry-list" style="margin-top:8px;">${entries}</div>
    </div>
  `;
}

/* ===== 傾向分析（半年・年間用） ===== */
function renderTrendAnalysis(items) {
  const sortedByPositive = [...items].sort((a, b) => b.positive_count - a.positive_count);
  const topDay = sortedByPositive[0];
  const subjectFreq = {};
  items.forEach(d => {
    d.subject.split(/[・、]/).forEach(s => {
      if (s) subjectFreq[s] = (subjectFreq[s] || 0) + 1;
    });
  });
  const topSubjects = Object.entries(subjectFreq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([s, n]) => `${s}（${n}回）`)
    .join("、");

  return `
    <div class="section">
      <div class="section-title">傾向分析</div>
      <div class="section-content">
🏆 最も肯定発言が多かった日：${formatDateJP(topDay.date)}（${topDay.positive_count}回）

📚 頻出教科 TOP3：${topSubjects}

📈 期間全体の傾向：${items.length}日分の分析データから、教師の指導モデルが継続的に運用されている様子が見られます。
      </div>
    </div>
  `;
}

/* ============================================================
   📌 期間範囲計算
   ============================================================ */
function getWeekRange(dateStr) {
  const d = new Date(dateStr);
  const dayOfWeek = d.getDay();
  const start = new Date(d); start.setDate(d.getDate() - dayOfWeek);
  const end = new Date(start); end.setDate(start.getDate() + 6);
  return { start, end };
}
function getMonthRange(dateStr) {
  const d = new Date(dateStr);
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start, end };
}
function getHalfRange(dateStr) {
  const d = new Date(dateStr);
  const start = new Date(d); start.setMonth(d.getMonth() - 5); start.setDate(1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { start, end };
}
function getYearRange(dateStr) {
  const d = new Date(dateStr);
  const start = new Date(d.getFullYear(), 0, 1);
  const end = new Date(d.getFullYear(), 11, 31);
  return { start, end };
}

/* ============================================================
   📌 イベントリスナー
   ============================================================ */
// 月送り
document.getElementById("prevMonth").addEventListener("click", () => {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
});
document.getElementById("nextMonth").addEventListener("click", () => {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
});

// 期間ボタン
document.querySelectorAll(".period-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".period-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentPeriod = btn.dataset.period;
    renderDetail();
  });
});

/* ============================================================
   📌 初期描画
   ============================================================ */
renderCalendar();

// 最新データの日付を初期選択
if (ANALYSIS_DATA.length > 0) {
  const latest = ANALYSIS_DATA[ANALYSIS_DATA.length - 1];
  selectedDate = latest.date;
  const latestDate = new Date(latest.date);
  currentDate = new Date(latestDate.getFullYear(), latestDate.getMonth(), 1);
  renderCalendar();
  renderDetail();
}
</script>
